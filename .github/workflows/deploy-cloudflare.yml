name: 🚀 Deploy cloud-mail to Cloudflare Workers

on:
  push:
    branches: [ main ]
    paths:
      - "mail-worker/**"
      - "mail-vue/**"
  workflow_dispatch:

jobs:
  Deploy-cloud-mail:
    name: 🏗️ Build and Deploy
    runs-on: ubuntu-latest

    env:
      NAME: ${{ secrets.NAME || vars.NAME || 'cloud-mail' }}
      CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN || vars.CUSTOM_DOMAIN }}
      DOMAIN: ${{ secrets.DOMAIN || vars.DOMAIN }}
      ADMIN: ${{ secrets.ADMIN || vars.ADMIN }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || vars.JWT_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID || vars.KV_NAMESPACE_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}
      PROJECT_LINK: ${{ secrets.PROJECT_LINK || vars.PROJECT_LINK }}
      AI_MODEL: ${{ secrets.AI_MODEL || vars.AI_MODEL || '@cf/meta/llama-3.1-8b-instruct-fast' }}
      EMAIL: ${{ secrets.EMAIL || vars.EMAIL }}
      ANALYSIS_CACHE: ${{ secrets.ANALYSIS_CACHE || vars.ANALYSIS_CACHE || false }}


    outputs:
      worker_url: ${{ steps.deploy.outputs.worker_url }}


    steps:
      - name: 🚚 检出代码仓库 / Checkout repository
        uses: actions/checkout@v4

      - name: ⚙ 设置 pnpm / Set up pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 11

      - name: ⚙ 设置 Node.js / Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "./mail-worker/pnpm-lock.yaml"

      - name: 📦 安装依赖 / Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./mail-worker

      - name: 📡 禁用 Wrangler 遥测 / Disable wrangler telemetry
        working-directory: ./mail-worker
        run: pnpm wrangler telemetry disable

      - name: 🛠️ 设置环境 / Set up environment
        working-directory: ./mail-worker
        run: |
          echo "🔐 Starting environment setup..."

          CONFIG_FILE="wrangler-action.toml"

          python3 - "$CONFIG_FILE" <<'PY'
          import json, os, sys

          NL = chr(10)
          CR = chr(13)
          BOM = chr(65279)
          BSLASH = chr(92)

          cfg_path = sys.argv[1]

          def get(name):
              raw = os.environ.get(name)
              if raw is None:
                  return ""
              return raw.replace(CR, NL).lstrip(BOM).strip()

          KEYS = ["NAME", "CUSTOM_DOMAIN", "DOMAIN", "ADMIN", "JWT_SECRET",
                  "R2_BUCKET_NAME", "PROJECT_LINK", "ANALYSIS_CACHE", "AI_MODEL",
                  "EMAIL", "CLOUDFLARE_ACCOUNT_ID", "CLOUDFLARE_API_TOKEN",
                  "D1_DATABASE_ID", "KV_NAMESPACE_ID",
                  "LINUXDO_CLIENT_ID", "LINUXDO_CLIENT_SECRET", "LINUXDO_CALLBACK_URL"]
          v = {}
          for k in KEYS:
              v[k] = get(k)
          if not v["NAME"]:
              v["NAME"] = "cloud-mail"
          if not v["ANALYSIS_CACHE"]:
              v["ANALYSIS_CACHE"] = "false"
          if not v["AI_MODEL"]:
              v["AI_MODEL"] = "@cf/meta/llama-3.1-8b-instruct-fast"

          errors = []
          for k in KEYS:
              if NL in v[k]:
                  errors.append(k + " 含换行符（多行值），请在仓库 Secret 里改成单行")
          if not v["JWT_SECRET"]:
              errors.append("JWT_SECRET 为空")
          else:
              bad = set('?%#/|&"') | set(NL) | set(BSLASH) | set(" ") | set(chr(9))
              hit = sorted(set(v["JWT_SECRET"]) & bad)
              if hit:
                  errors.append("JWT_SECRET 含非法字符 " + str(hit) + "，建议只用字母、数字、- 和 _")
          if not v["ADMIN"]:
              errors.append("ADMIN 为空")
          if not v["CLOUDFLARE_ACCOUNT_ID"]:
              errors.append("CLOUDFLARE_ACCOUNT_ID 为空")
          if not v["CLOUDFLARE_API_TOKEN"]:
              errors.append("CLOUDFLARE_API_TOKEN 为空")

          domains = None
          try:
              domains = json.loads(v["DOMAIN"])
              if not isinstance(domains, list) or not domains:
                  raise ValueError
          except Exception:
              errors.append('DOMAIN 必须是 JSON 数组，例如 ["example.com"]')

          if errors:
              print("❌ 环境变量校验失败：")
              for e in errors:
                  print("   - " + e)
              sys.exit(1)

          if not v["CUSTOM_DOMAIN"]:
              print("::warning:: CUSTOM_DOMAIN variable is not set.")

          domain_json = json.dumps(domains, ensure_ascii=False)
          text = open(cfg_path, encoding="utf-8").read()

          def drop_section(src_text, header):
              out = []
              skip = False
              for ln in src_text.split(NL):
                  if ln.strip() == header:
                      skip = True
                      continue
                  if skip:
                      if ln.strip() == "":
                          skip = False
                      continue
                  out.append(ln)
              return NL.join(out)

          if not v["R2_BUCKET_NAME"]:
              text = drop_section(text, "[[r2_buckets]]")
          if not v["CUSTOM_DOMAIN"]:
              text = drop_section(text, "[[routes]]")
          if not v["PROJECT_LINK"]:
              kept = []
              for ln in text.split(NL):
                  if not ln.startswith("project_link = "):
                      kept.append(ln)
              text = NL.join(kept)

          # 纯字面替换：不走正则、不用 sed 分隔符，彻底规避特殊字符导致的语法错误
          text = text.replace('"${DOMAIN}"', domain_json)
          text = text.replace("${DOMAIN}", domain_json)
          for k in ["NAME", "CUSTOM_DOMAIN", "ADMIN", "JWT_SECRET", "R2_BUCKET_NAME",
                    "PROJECT_LINK", "ANALYSIS_CACHE", "AI_MODEL",
                    "LINUXDO_CLIENT_ID", "LINUXDO_CLIENT_SECRET", "LINUXDO_CALLBACK_URL"]:
              text = text.replace("${" + k + "}", v[k])

          if v["EMAIL"] and 'name = "email"' not in text:
              text = text.rstrip(NL) + NL + NL + '[[send_email]]' + NL + 'name = "email"' + NL

          f = open(cfg_path, "w", encoding="utf-8", newline=NL)
          f.write(text)
          f.close()
          print("✅ 配置渲染完成（字面替换，无 sed 注入风险）")
          print("   NAME=" + v["NAME"] + "  DOMAIN=" + domain_json)
          PY

          if [ ! -s "$CONFIG_FILE" ]; then
            echo "❌ 配置渲染失败：$CONFIG_FILE 不存在或为空"
            exit 1
          fi

          echo "✅ Environment setup completed."

      - name: ⚡ 设置KV数据库 / Set up KV database
        working-directory: ./mail-worker
        run: |
          
          CONFIG_FILE="wrangler-action.toml"
          
          if [ -n "$KV_NAMESPACE_ID" ]; then
            sed -i "s|\${KV_NAMESPACE_ID}|${KV_NAMESPACE_ID}|g" "$CONFIG_FILE"
            echo "✅ Using the database from environment variables."
            exit 0
          fi
          
          echo "🔍 Checking if the database exists..."
          
          set +e
            KV_LIST=$(pnpm wrangler kv namespace list 2>&1)
            STATUS=$?
          set -e
          
          if [ $STATUS -ne 0 ]; then
            echo "$KV_LIST"
            exit 1
          fi
                  
          if echo "$KV_LIST" | jq -e ".[] | select(.title == \"$NAME\")" >/dev/null; then
            echo "✅ Database $NAME already exists."
            KV_ID=$(echo "$KV_LIST" | jq -r ".[] | select(.title == \"$NAME\") | .id")
            echo "KV_NAMESPACE_ID: $KV_ID"
          else
            echo "⚠️ Database $NAME does not exist. Starting creation..."
            pnpm wrangler kv namespace create $NAME
            KV_LIST=$(pnpm wrangler kv namespace list)
            KV_ID=$(echo "$KV_LIST" | jq -r ".[] | select(.title == \"$NAME\") | .id")
          fi
          
          sed -i "s|\${KV_NAMESPACE_ID}|$KV_ID|g" "$CONFIG_FILE"
          echo "✅ Setup completed."

      - name: 🐬 设置D1数据库 / Set up D1 database
        working-directory: ./mail-worker
        run: |
          
          CONFIG_FILE="wrangler-action.toml"
          
          if [ -n "$D1_DATABASE_ID" ]; then
            sed -i "s|\${D1_DATABASE_ID}|${D1_DATABASE_ID}|g" "$CONFIG_FILE"
            echo "✅ Using the database from environment variables."
            exit 0
          fi
          
          echo "🔍 Checking if the database exists..."
          
          set +e
            DB_LIST=$(pnpm wrangler d1 list --json 2>&1)
            STATUS=$?
          set -e
          
          if [ $STATUS -ne 0 ]; then
            echo "$DB_LIST"
            exit 1
          fi
          
          if echo "$DB_LIST" | jq -e ".[] | select(.name == \"$NAME\")" >/dev/null; then
            echo "✅ Database $NAME already exists."
            D1_ID=$(echo "$DB_LIST" | jq -r ".[] | select(.name == \"$NAME\") | .uuid")
            echo "D1_DATABASE_ID: $D1_ID"
          else
            echo "⚠️ Database $NAME does not exist. Starting creation..."
            pnpm wrangler d1 create $NAME
            DB_LIST=$(pnpm wrangler d1 list --json)
            D1_ID=$(echo "$DB_LIST" | jq -r ".[] | select(.name == \"$NAME\") | .uuid")
          fi
          
          sed -i "s|\${D1_DATABASE_ID}|$D1_ID|g" "$CONFIG_FILE"
          echo "✅ Setup completed."

      - name: 🚀 开始部署 / Start deployment
        id: deploy
        working-directory: ./mail-worker
        run: |
          echo "🚀 Starting deployment..."
          pnpm wrangler deploy -c wrangler-action.toml 2>&1 \
            | tee deploy.log \
            | grep -v "https://.*\.workers\.dev" \
            | sed -E 's/env\.domain .*/env.domain (***)/' \
            || true
          
          DEPLOY_EXIT_CODE=${PIPESTATUS[0]}
          if [ $DEPLOY_EXIT_CODE -ne 0 ]; then
            exit 1
          fi
          
          WORKER_URL=$(grep -o "https://.*\.workers\.dev" deploy.log || echo "")
          
          if [ -n "$WORKER_URL" ]; then
            echo "::add-mask::$WORKER_URL"
          fi
          
          echo "worker_url=$WORKER_URL" >> $GITHUB_OUTPUT
          echo "✅ Setup completed."

      - name: ♻️ 初始化数据库 / Initialize database
        run: |
          echo "🛠️ Starting database initialization..."
          sleep 15
          
          WORKER_URL="${CUSTOM_DOMAIN:+https://$CUSTOM_DOMAIN}"
          WORKER_URL="${WORKER_URL:-${{ steps.deploy.outputs.worker_url }}}"
          
          if [ -z "$WORKER_URL" ]; then
            echo "❌ Preview URL not available. Please set CUSTOM_DOMAIN."
            exit 1
          fi
          
          HTTP_CODE=$(curl -sL -w "%{http_code}" -o response.txt "$WORKER_URL/api/init/${JWT_SECRET}")
          RESPONSE_BODY=$(cat response.txt)

          if [ "$RESPONSE_BODY" = "success" ]; then
            echo "✅ Setup completed."
          else
            echo "❌ Failed. HTTP: $HTTP_CODE, Response: $RESPONSE_BODY"
            exit 1
          fi

      - name: 🗑️ 删除运行记录 / Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        continue-on-error: true
        with:
          retain_days: '1'
          keep_minimum_runs: '0'
